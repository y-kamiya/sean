[tool.poetry]
name = "sean"
version = "0.2.0"
description = ""
authors = ["y-kamiya <y.kamiya0@gmail.com>"]
readme = "README.md"
packages = [{include = "sean", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10.1"
torch = [
    { version = "2.2.2", markers = "sys_platform == 'darwin'", source = "pypi"},
    { version = "2.2.2", markers = "sys_platform == 'linux'", source = "torch_cu121" },
]
torchvision = [
    { version = "0.17.2", markers = "sys_platform == 'darwin'", source = "pypi" },
    { version = "0.17.2", markers = "sys_platform == 'linux'", source = "torch_cu121" },
]
argparse-dataclass = "^1.0.0"
logzero = "^1.7.0"
tensorboard = "^2.12.1"
accelerate = "^0.18.0"


[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
isort = "^5.12.0"


[[tool.poetry.source]]
name = "torch_cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 120

[tool.mypy]
ignore_missing_imports = true
